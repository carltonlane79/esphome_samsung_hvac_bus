sensor:
- platform: copy
  source_id: water_return_temp_20_00_00
  name: Water Temperature (Heating Loop)
  id: water_temperature_20_00_00
- platform: template
  name: Heat Output (Calculated)
  id: heat_output_calculated
  unit_of_measurement: W
  device_class: power
  state_class: measurement
  accuracy_decimals: 0
  update_interval: 30s
  lambda: |-
    float f = id(water_flow_rate_20_00_00).state;
    float t_out = id(water_out_temp_4238).state;
    float t_ret = id(water_return_temp_20_00_00).state;
    if (std::isnan(f) || std::isnan(t_out) || std::isnan(t_ret)) return {};
    // no flow: the sensors drift and the difference means nothing
    if (f < 2.0f) return 0.0f;
    // 4.186 kJ/kg.K, 1 L/min = 1/60 kg/s
    return std::max(0.0f, f * (t_out - t_ret) * 69.77f);
- platform: template
  name: Lifetime COP
  id: lifetime_cop
  accuracy_decimals: 2
  state_class: measurement
  update_interval: 300s
  lambda: |-
    float heat = id(total_energy_produced_20_00_00).state;
    float elec = id(energy_accumulated_10_00_00).state;
    if (std::isnan(heat) || std::isnan(elec) || elec <= 0) return {};
    return heat / elec;
- platform: template
  name: Instantaneous COP
  id: instantaneous_cop
  accuracy_decimals: 2
  state_class: measurement
  update_interval: 30s
  lambda: |-
    float heat = id(heat_output_20_00_00).state;
    float elec = id(outdoor_unit_power_10_00_00).state;
    if (std::isnan(heat) || std::isnan(elec) || elec < 200) return {};
    return heat / elec;
