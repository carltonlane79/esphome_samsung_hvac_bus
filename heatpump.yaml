# Samsung EHS Mono (AE120BXYDEG) on upstream samsung_ac. Custom sensors receive raw NASA values; filters do the scaling.
esphome:
  name: esphome-web-fd4e7c
  friendly_name: samsung_heatpump
  comment: Samsung AC Heatpump
  min_version: 2024.11.0
  name_add_mac_suffix: false
esp32:
  board: m5stack-atom
  framework:
    type: esp-idf
web_server:
  port: 80
logger:
  level: DEBUG
api: null
ota:
  platform: esphome
wifi:
  ssid: !secret 'wifi_ssid'
  password: !secret 'wifi_password'
  manual_ip:
    static_ip: 192.168.2.234
    gateway: 192.168.2.1
    subnet: 255.255.255.0
captive_portal: null
uart:
  id: uart_bus
  tx_pin: GPIO19
  rx_pin: GPIO22
  baud_rate: 9600
  parity: EVEN
external_components:
- source: ./components
  components:
  - samsung_ac
samsung_ac:
  id: samsung_ac_controller
  uart_id: uart_bus
  debug_log_undefined_messages: true
  debug_log_messages: true
  capabilities:
    vertical_swing: false
    horizontal_swing: false
  devices:
  - address: 20.00.00
    capabilities:
      horizontal_swing: false
      vertical_swing: false
    climate:
      name: Heat Pump climate
      id: climate_20_00_00
    target_temperature:
      name: Heat Pump target temperature
      id: target_temperature_20_00_00
    power:
      name: Heat Pump power
      id: power_20_00_00
    mode:
      name: Heat Pump mode
      id: mode_20_00_00
    indoor_eva_in_temperature:
      name: Evaporator Inlet Water Temperature
      id: evap_inlet_water_temperature_20_00_00
      accuracy_decimals: 1
      filters:
      - lambda: if (x <= -50) return {}; return x;
    indoor_eva_out_temperature:
      name: Evaporator Outlet Water Temperature
      id: evap_outlet_water_temperature_20_00_00
      accuracy_decimals: 1
      filters:
      - lambda: if (x <= -50) return {}; return x;
    custom_sensor:
    - name: Operation Mode
      message: 0x4001
      id: operation_mode_20_00_00
      internal: true
    - name: Indoor Temperature
      message: 0x4203
      id: room_temperature_20_00_00
      unit_of_measurement: °C
      accuracy_decimals: 1
      device_class: temperature
      state_class: measurement
      filters:
      - lambda: int16_t v = (int16_t) x; if (v <= -500) return {}; return (float) v;
      - multiply: 0.1
    - name: Water Outlet Target Temperature
      message: 0x4247
      id: water_outlet_target_temperature_20_00_00
      unit_of_measurement: °C
      accuracy_decimals: 1
      filters:
      - lambda: int16_t v = (int16_t) x; if (v <= -500) return {}; return (float) v;
      - multiply: 0.1
    - name: DHW Operation Enable
      message: 0x4065
      id: dhw_operation_enable
      internal: true
    - name: DHW Mode Setting
      message: 0x4066
      id: dhw_mode_setting
      internal: true
    - name: DHW Target Temperature
      message: 0x4235
      unit_of_measurement: °C
      accuracy_decimals: 1
      device_class: temperature
      state_class: measurement
      id: dhw_setpoint_temp
